name: Release Android App

on:
  push:
    tags:
      - 'v*' # Trigger when a tag like v1.0.0 is pushed

permissions:
  contents: write # Required for creating GitHub Releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          echo "$KEY_PROPERTIES" > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: flutter build apk --release --dart-define=CWA_API_KEY=$CWA_API_KEY

      - name: Build Android App Bundle (AAB)
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: flutter build appbundle --release --dart-define=CWA_API_KEY=$CWA_API_KEY

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
