name: Release Android App

on:
  push:
    tags:
      - 'v*' # Trigger when a tag like v1.0.0 is pushed

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          flutter-version: '3.50.1'

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Android signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEY_PROPERTIES" ]]; then
            echo 'Android signing secrets are missing.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s\n' "$KEY_PROPERTIES" > android/key.properties

      - name: Build Android APK
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: flutter build apk --release --dart-define="CWA_API_KEY=$CWA_API_KEY"

      - name: Build Android App Bundle (AAB)
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: flutter build appbundle --release --dart-define="CWA_API_KEY=$CWA_API_KEY"

      - name: Remove Android signing files
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Upload Android packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release
          path: android-release

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            android-release/flutter-apk/app-release.apk
            android-release/bundle/release/app-release.aab
          fail_on_unmatched_files: true
          generate_release_notes: true
