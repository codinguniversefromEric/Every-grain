name: Android Release Build

on:
  # Trigger when a new version tag is pushed (e.g., git tag v1.0.0 && git push origin v1.0.0)
  push:
    tags:
      - 'v*'
  # Allow manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build and Release APK
    runs-on: ubuntu-latest
    
    # Needs permission to create a release in the repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        # Build the APK. It injects the CWA API KEY from GitHub Secrets.
        run: flutter build apk --release --dart-define=CWA_API_KEY=${{ secrets.CWA_API_KEY }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        # Only create a release if it was triggered by a tag push
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
