    .mountain {

      height: 40px;

          <!-- Page 2: Journal -->
          <div class="carousel-page h-full p-6 sm:p-8 flex flex-col items-center justify-center">

            </p>

            <button class="mt-auto mb-4 px-6 py-2.5 border border-[#9A8060]/60 text-[#665246] rounded-full text-sm hover:bg-[#9A8060]/10 transition-colors shadow-sm">

          </div>

          <!-- Page 3: Collection -->
          <div class="carousel-page h-full p-6 sm:p-8 flex flex-col">
            <div class="flex items-center gap-3 mb-6 w-full justify-center opacity-80">
              <div class="h-px bg-[#9A8060]/30 flex-1 max-w-[40px]"></div>
              <h2 class="text-xl serif-tc font-bold text-[#3E2723] tracking-widest">圖鑑</h2>

            </div>
            
            <div class="grid grid-cols-2 gap-3 sm:gap-4 flex-1 overflow-y-auto pr-1 custom-scrollbar pb-4">
              <div class="border border-[#9A8060]/40 rounded-xl p-4 flex flex-col items-center bg-[#F2E9D6]/40 shadow-sm">
                <div class="w-12 h-12 rounded-full border border-[#9A8060]/30 flex items-center justify-center mb-3 text-xl shadow-inner bg-white/20">🌾</div>
                <div class="serif-tc font-bold text-[#3E2723] mb-1">台南11號</div>
                <div class="text-[10px] text-[#665246] tracking-widest">豐收之王</div>
              </div>
              <div class="border border-[#9A8060]/40 rounded-xl p-4 flex flex-col items-center bg-[#F2E9D6]/40 shadow-sm">
                <div class="w-12 h-12 rounded-full border border-[#9A8060]/30 flex items-center justify-center mb-3 text-xl shadow-inner bg-white/20">🌾</div>
                <div class="serif-tc font-bold text-[#3E2723] mb-1">高雄139號</div>
                <div class="text-[10px] text-[#665246] tracking-widest">醜美人</div>
              </div>
              <div class="border border-[#9A8060]/15 rounded-xl p-4 flex flex-col items-center opacity-50 bg-[#E9DFC8]/30">
                <div class="w-12 h-12 rounded-full border border-[#9A8060]/10 flex items-center justify-center mb-3 text-[#9A8060]">?</div>

      <!-- Carousel Dots -->
      <div class="flex justify-center gap-3 pb-8 pt-2">
        <div class="w-1.5 h-1.5 rounded-full bg-[#5D4037] cursor-pointer transition-colors" onclick="goToPage(0)" id="dot-0"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-[#9A8060]/40 cursor-pointer transition-colors" onclick="goToPage(1)" id="dot-1"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-[#9A8060]/40 cursor-pointer transition-colors" onclick="goToPage(2)" id="dot-2"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-[#9A8060]/40 cursor-pointer transition-colors" onclick="goToPage(3)" id="dot-3"></div>

  <script>
    const sheet = document.getElementById('bottom-sheet');
    const quote = document.getElementById('ambient-quote');
    let isOpen = false;
    
    function openSheet() {
      isOpen = true;
      sheet.classList.remove('translate-y-full');
      quote.style.opacity = '0';
    }
    
    function closeSheet() {
      isOpen = false;
      sheet.classList.add('translate-y-full');
      quote.style.opacity = '0.4';
    }
    
    let currentPage = 1; 
    const carousel = document.getElementById('carousel');
    const totalPages = 4;
    
    function updateDots() {
      for(let i=0; i<totalPages; i++) {
        const dot = document.getElementById('dot-'+i);
        if(i === currentPage) {
          dot.classList.remove('bg-[#9A8060]/40');
          dot.classList.add('bg-[#5D4037]', 'scale-125');
        } else {
          dot.classList.remove('bg-[#5D4037]', 'scale-125');
          dot.classList.add('bg-[#9A8060]/40');
        }
      }
    }
    
    function goToPage(index) {
      currentPage = index;
      carousel.style.transform = `translateX(-${currentPage * 25}%)`;
      updateDots();
    }
    
    goToPage(1); // Start at Journal

    // Mouse & Touch Swipe Detection
    let startX = 0;
    let startY = 0;
    
    function handleStart(clientX, clientY) {
      startX = clientX;
      startY = clientY;
    }
    
    function handleEnd(clientX, clientY) {
      let dx = clientX - startX;
      let dy = clientY - startY;
      
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
        if (dx < 0 && currentPage < totalPages - 1) goToPage(currentPage + 1); 
        else if (dx > 0 && currentPage > 0) goToPage(currentPage - 1); 
      }
      
      if (dy > 80 && Math.abs(dy) > Math.abs(dx)) {
        closeSheet();
      }
    }

    sheet.addEventListener('touchstart', e => handleStart(e.changedTouches[0].screenX, e.changedTouches[0].screenY));
    sheet.addEventListener('touchend', e => handleEnd(e.changedTouches[0].screenX, e.changedTouches[0].screenY));
    sheet.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
    sheet.addEventListener('mouseup', e => handleEnd(e.clientX, e.clientY));

    // Generate Rain
    const rc = document.getElementById('rain-container');
    for(let i=0; i<30; i++) {
      let drop = document.createElement('div');
      drop.className = 'rain';
      drop.style.left = Math.random() * 100 + '%';
      drop.style.top = (Math.random() * 100 - 100) + '%';
      drop.style.animationDuration = (0.6 + Math.random() * 0.4) + 's';
      drop.style.opacity = Math.random() * 0.6;
      rc.appendChild(drop);
    }
  </script>
