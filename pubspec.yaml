name: rice_journey
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.6+9

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.1
  shared_preferences: ^2.2.3
  geolocator: ^14.0.3
  google_fonts: ^8.2.1
  just_audio: ^0.10.6
  http: ^1.2.0
  url_launcher: ^6.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.jpg"
  adaptive_icon_background: "#FFF8E7"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon.jpg"
    background_color: "#FFF8E7"
    theme_color: "#FFF8E7"
  windows:
    generate: true
    image_path: "assets/icon.jpg"
    icon_size: 48
